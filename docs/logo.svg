<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="240" rx="104" fill="url(#glass)"/>
  <rect x="19" y="19" width="474" height="474" rx="101" fill="none" stroke="#334155" stroke-width="6" opacity="0.9"/>

  <!-- session bubble with tail -->
  <path d="M136 118 H376 Q416 118 416 158 V306 Q416 346 376 346 H258 L190 402 V346 H136 Q96 346 96 306 V158 Q96 118 136 118 Z"
        fill="#020617" stroke="#334155" stroke-width="5" stroke-linejoin="round"/>

  <!-- clock face -->
  <circle cx="256" cy="232" r="84" fill="none" stroke="#38bdf8" stroke-width="13"/>
  <!-- quarter ticks -->
  <g stroke="#475569" stroke-width="7" stroke-linecap="round">
    <line x1="256" y1="170" x2="256" y2="158"/>
    <line x1="318" y1="232" x2="330" y2="232"/>
    <line x1="256" y1="294" x2="256" y2="306"/>
    <line x1="194" y1="232" x2="182" y2="232"/>
  </g>
  <!-- hands at 09:00 (smart work-hours slot start) -->
  <line x1="256" y1="232" x2="216" y2="232" stroke="#e2e8f0" stroke-width="17" stroke-linecap="round"/>
  <line x1="256" y1="232" x2="256" y2="184" stroke="#e2e8f0" stroke-width="13" stroke-linecap="round"/>
  <circle cx="256" cy="232" r="11" fill="#38bdf8"/>

  <!-- reminder bell badge -->
  <circle cx="386" cy="338" r="46" fill="#fbbf24" stroke="#0b1220" stroke-width="10"/>
  <path d="M386 312 c-13 0 -22 10 -22 23 v11 l-8 10 h60 l-8 -10 v-11 c0 -13 -9 -23 -22 -23 z" fill="#0b1220"/>
  <circle cx="386" cy="364" r="6" fill="#0b1220"/>
</svg>
