<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dsh-later · 暂停斜纹样式预览</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --bg-soft: #f6f7f9;
    --text: #1b1d21;
    --text-dim: #6b7280;
    --line: #e5e7eb;
    --line-strong: #d1d5db;
    --brand: #4d6bfe;
    --brand-soft: #eef1ff;
    --tip: #f4f5f7;
    --hover: rgba(0, 0, 0, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181b;
      --bg-soft: #1f2126;
      --text: #e8e9ec;
      --text-dim: #9aa0a8;
      --line: #2c2f35;
      --line-strong: #3a3e46;
      --brand: #7b93ff;
      --brand-soft: #232a44;
      --tip: #212328;
      --hover: rgba(255, 255, 255, 0.07);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 20px 64px;
    background: var(--bg-soft);
    color: var(--text);
    font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.55;
  }
  .page { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .lede { color: var(--text-dim); margin: 0 0 18px; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
    margin-bottom: 16px; padding: 12px 14px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
  }
  .controls label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); }
  .controls input[type="range"] { width: 160px; accent-color: var(--brand); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px 14px;
  }
  .card-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; margin-bottom: 10px;
  }
  .card-title { font-weight: 600; font-size: 13px; }
  .card-tag {
    font-size: 11px; color: var(--brand); background: var(--brand-soft);
    padding: 1px 8px; border-radius: 999px; white-space: nowrap;
  }
  .card-desc { color: var(--text-dim); font-size: 12px; margin: 0 0 12px; min-height: 2.6em; }

  /* 与 dock 行同构：单行 + 6px 进度条 */
  .row {
    display: flex; align-items: center; gap: 10px;
    min-height: 36px; padding: 4px 8px 4px 10px;
    border-radius: 8px; background: var(--tip);
  }
  .preview { flex: auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .line { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .time, .count { flex: none; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .count.paused { color: var(--text-dim); }
  .prompt { flex: 1; min-width: 0; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar {
    position: relative; height: 6px; border-radius: 999px; overflow: hidden;
    background: var(--line);
  }
  .fill {
    position: relative; z-index: 1; height: 100%; border-radius: 999px;
    background: var(--brand); transition: none;
  }
  .row-actions { display: flex; gap: 4px; flex: none; color: var(--text-dim); font-size: 12px; }

  /* ========== 样式矩阵（只改 .fill / 可选 .bar） ========== */

  /* A 经典斜纹（当前定稿方向） */
  .s-classic .fill {
    background:
      repeating-linear-gradient(115deg, var(--text-dim) 0 5px, transparent 5px 10px),
      var(--line-strong);
    opacity: 0.9;
  }

  /* B 密斜纹 —— 更像“停住的磁带” */
  .s-dense .fill {
    background:
      repeating-linear-gradient(115deg, var(--text-dim) 0 3px, transparent 3px 6px),
      color-mix(in srgb, var(--text-dim) 35%, var(--line-strong));
    opacity: 0.95;
  }

  /* C 反向斜纹 */
  .s-reverse .fill {
    background:
      repeating-linear-gradient(65deg, var(--text-dim) 0 5px, transparent 5px 10px),
      var(--line-strong);
    opacity: 0.9;
  }

  /* D 交叉网格 */
  .s-cross .fill {
    background:
      repeating-linear-gradient(115deg, var(--text-dim) 0 2px, transparent 2px 7px),
      repeating-linear-gradient(25deg, var(--text-dim) 0 2px, transparent 2px 7px),
      var(--line-strong);
    opacity: 0.9;
  }

  /* E 水平扫描线 */
  .s-scan .fill {
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.28) 0 1px, transparent 1px 3px),
      color-mix(in srgb, var(--text-dim) 70%, var(--line-strong));
    opacity: 0.95;
  }

  /* F 竖百叶 */
  .s-blinds .fill {
    background:
      repeating-linear-gradient(90deg, var(--text-dim) 0 2px, transparent 2px 6px),
      var(--line-strong);
    opacity: 0.9;
  }

  /* G 品牌褪色 + 斜纹（更贴活动态） */
  .s-brand .fill {
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.35) 0 4px, transparent 4px 9px),
      color-mix(in srgb, var(--brand) 28%, var(--line-strong));
    opacity: 1;
  }

  /* H 点阵霜 */
  .s-dots .fill {
    background:
      radial-gradient(circle at 2px 2px, var(--text-dim) 1px, transparent 1.2px) 0 0 / 6px 6px,
      var(--line-strong);
    opacity: 0.9;
  }

  /* I 粗条纹（高对比，暗色友好） */
  .s-bold .fill {
    background:
      repeating-linear-gradient(115deg, var(--text) 0 6px, transparent 6px 12px);
    opacity: 0.55;
  }

  /* J 阴影凹槽 —— 更像“冻在轨道里” */
  .s-groove .bar {
    box-shadow: inset 0 1px 2px rgba(0,0,0,.12);
  }
  .s-groove .fill {
    background:
      repeating-linear-gradient(115deg, var(--text-dim) 0 4px, transparent 4px 8px),
      color-mix(in srgb, var(--line-strong) 70%, var(--bg-soft));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
    opacity: 1;
  }

  .hint { margin-top: 18px; color: var(--text-dim); font-size: 12px; }
  .hint code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; background: var(--bg-soft); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 4px;
  }
</style>
</head>
<body>
<div class="page">
  <h1>暂停进度条 · 斜纹样式矩阵</h1>
  <p class="lede">几何与 dock 一致（6px 轨道、只改 fill）。拖动进度看不同冻结位置；主题跟随系统浅色/深色。</p>

  <div class="controls">
    <label>进度
      <input id="pct" type="range" min="4" max="92" value="28" />
      <span id="pctLabel">28%</span>
    </label>
    <label>窗口
      <input id="win" type="range" min="5" max="120" value="60" />
      <span id="winLabel">60 分钟</span>
    </label>
    <button type="button" id="btnDemo" style="font:inherit;font-size:12px;padding:4px 12px;border-radius:999px;border:1px solid var(--line-strong);background:none;color:var(--text-dim);cursor:pointer;">切换到 demo 斜纹</button>
  </div>

  <div class="grid" id="grid"></div>

  <p class="hint">
    选型后把编号告诉我（如 <code>B</code> / <code>G</code>）。
    生产里会映射到宿主 token：<code>text-dim → label-tertiary</code>，
    <code>line-strong → line-secondary</code>，品牌色用 <code>brand-primary</code>。
  </p>
</div>

<script>
const STYLES = [
  { id: 'classic', cls: 's-classic', title: 'A · 经典斜纹', tag: '当前定稿', desc: '115° · 5px 条纹。与 docs/ui demo 一致，最克制。' },
  { id: 'dense', cls: 's-dense', title: 'B · 密斜纹', tag: '高辨识', desc: '3px 密纹 + 略深底，更像「停住的磁带」。' },
  { id: 'reverse', cls: 's-reverse', title: 'C · 反向斜纹', tag: '镜像', desc: '65° 反向，与 A 同密度，方向感不同。' },
  { id: 'cross', cls: 's-cross', title: 'D · 交叉网格', tag: '工程感', desc: '双向细纹，像结霜网格；信息密度更高。' },
  { id: 'scan', cls: 's-scan', title: 'E · 水平扫描线', tag: 'CRT', desc: '横细线，待机/CRT 隐喻；低 DPI 可能发糊。' },
  { id: 'blinds', cls: 's-blinds', title: 'F · 竖百叶', tag: '垂直', desc: '竖条纹，和倒计时「横向时间」正交，区分度高。' },
  { id: 'brand', cls: 's-brand', title: 'G · 品牌褪色', tag: '贴活动态', desc: '仍带一点品牌蓝 + 白斜纹，和进行中条最连续。' },
  { id: 'dots', cls: 's-dots', title: 'H · 点阵霜', tag: '轻', desc: '小圆点阵，像玻璃结霜；暗色下可能偏弱。' },
  { id: 'bold', cls: 's-bold', title: 'I · 粗条纹', tag: '暗色友好', desc: '6px 粗纹 + 降低不透明度，暗色主题最稳。' },
  { id: 'groove', cls: 's-groove', title: 'J · 凹槽冻结', tag: '质感', desc: '轨道内阴影 + 斜纹填充，像冻在凹槽里。' },
];

const grid = document.getElementById('grid');
const pct = document.getElementById('pct');
const win = document.getElementById('win');
const pctLabel = document.getElementById('pctLabel');
const winLabel = document.getElementById('winLabel');

function fmtWin(min) {
  if (min < 60) return min + ' 分钟';
  const h = Math.floor(min / 60);
  const m = min % 60;
  return m ? h + ' 小时 ' + m + ' 分' : h + ' 小时';
}

function render() {
  const ratio = Number(pct.value) / 100;
  const minutes = Number(win.value);
  const remainSec = Math.round(minutes * 60 * (1 - ratio));
  const hh = String(Math.floor(remainSec / 3600)).padStart(2, '0');
  const mm = String(Math.floor((remainSec % 3600) / 60)).padStart(2, '0');
  const ss = String(remainSec % 60).padStart(2, '0');
  const remainText = remainSec >= 3600 ? `${hh}:${mm}:${ss}` : `${mm}:${ss}`;

  pctLabel.textContent = pct.value + '%';
  winLabel.textContent = fmtWin(minutes);

  grid.innerHTML = STYLES.map((s) => `
    <article class="card ${s.cls}">
      <div class="card-head">
        <span class="card-title">${s.title}</span>
        <span class="card-tag">${s.tag}</span>
      </div>
      <p class="card-desc">${s.desc}</p>
      <div class="row">
        <div class="preview">
          <div class="line">
            <span class="time">15:30</span>
            <span class="count paused">已暂停</span>
            <span class="prompt">看一下构建结果</span>
          </div>
          <div class="bar" role="progressbar" aria-valuenow="${pct.value}">
            <div class="fill" style="width:${Math.max(6, ratio * 100)}%"></div>
          </div>
        </div>
        <div class="row-actions" aria-hidden="true">✎ ▶ 🗑 ↑</div>
      </div>
      <div style="margin-top:8px;font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums;">
        冻结剩余 ${remainText} · 填充 ${pct.value}%（最小 6px）
      </div>
    </article>
  `).join('');
}

pct.addEventListener('input', render);
win.addEventListener('input', render);
document.getElementById('btnDemo').addEventListener('click', () => {
  pct.value = '28';
  win.value = '60';
  render();
});

render();
</script>
</body>
</html>
