body{margin:0;background:#0f172a;font:15px/1.5 system-ui,"PingFang SC",sans-serif;padding:24px;color:#e2e8f0}
.row{display:flex;gap:20px;align-items:flex-start}
.v{width:512px;text-align:center}
.v .lab{font-size:17px;font-weight:600;margin-bottom:10px;color:#f1f5f9}
.strip{margin:20px 0 0;padding:12px 16px;background:#1e293b;border-radius:12px;display:flex;gap:22px;align-items:center}
.strip .light{background:#f8fafc;border-radius:8px;padding:8px 12px;display:flex;gap:12px;align-items:center}

<div class="row">
<div class='v'><div class='lab'>C1v2｜@ 定时</div>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgC1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a44"/>
      <stop offset="1" stop-color="#0a101e"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgC1)"/>

  <!-- 盘芯（bowl）：同时是表盘 -->
  <circle cx="262" cy="258" r="95" fill="none" stroke="#38bdf8" stroke-width="40"/>
  <!-- 外扫弧：从盘芯右上沿自然拔出，逆时针绕顶/左/底，收在右下形成 @ 开口 -->
  <path d="M350 196 A155 155 0 1 0 390 375" fill="none" stroke="#38bdf8" stroke-width="40" stroke-linecap="round"/>

  <!-- 盘芯里的指针 9:00 + 琥珀轴心 -->
  <line x1="262" y1="258" x2="212" y2="258" stroke="#f1f5f9" stroke-width="28" stroke-linecap="round"/>
  <line x1="262" y1="258" x2="262" y2="192" stroke="#f1f5f9" stroke-width="20" stroke-linecap="round"/>
  <circle cx="262" cy="258" r="14" fill="#fbbf24"/>
</svg>
</div>
<div class='v'><div class='lab'>C2｜时刻标记</div>

  <!-- 骑在环上的琥珀珠 = 你定的那个时刻 -->
  <circle cx="256" cy="102" r="30" fill="#fbbf24"/>
</svg>
</div>
