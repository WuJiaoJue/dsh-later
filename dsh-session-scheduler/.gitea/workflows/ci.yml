name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - uses: actions/checkout@v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查（host + client）
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsc -p tsconfig.client.json --noEmit
      - name: 测试
        run: npm test
