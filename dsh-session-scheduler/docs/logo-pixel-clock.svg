<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 像素时钟：基于 session-presence 的 CLOCK_SVG 设计，放大到 512x512 -->
  <!-- 原始设计：10x10 viewBox，每个像素块 2x2 -->
  <!-- 放大比例：512 / 10 = 51.2，这里用 48x48 的像素块，整体偏移居中 -->
  
  <!-- 外圈 ring（8个方块） -->
  <g fill="#8b5cf6" opacity="0.9">
    <!-- 左上 -->
    <rect x="140" y="140" width="48" height="48"/>
    <!-- 上中 -->
    <rect x="232" y="140" width="48" height="48"/>
    <!-- 右上 -->
    <rect x="324" y="140" width="48" height="48"/>
    <!-- 右中 -->
    <rect x="324" y="232" width="48" height="48"/>
    <!-- 右下 -->
    <rect x="324" y="324" width="48" height="48"/>
    <!-- 下中 -->
    <rect x="232" y="324" width="48" height="48"/>
    <!-- 左下 -->
    <rect x="140" y="324" width="48" height="48"/>
    <!-- 左中 -->
    <rect x="140" y="232" width="48" height="48"/>
  </g>

  <!-- 指针 hand（2个方块） -->
  <g fill="#a78bfa">
    <!-- 竖指针（12点方向） -->
    <rect x="232" y="188" width="48" height="48"/>
    <!-- 横指针（3点方向） -->
    <rect x="280" y="232" width="48" height="48"/>
  </g>
</svg>
