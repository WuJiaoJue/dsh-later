<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243247"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile（去掉双描边与无效高光） -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgA)"/>

  <!-- session bubble：提亮填充，让它读作「面」而不是「洞」 -->
  <path d="M136 118 H376 Q416 118 416 158 V306 Q416 346 376 346 H258 L190 402 V346 H136 Q96 346 96 306 V158 Q96 118 136 118 Z"
        fill="#1c2a44" stroke="#5b6b84" stroke-width="5" stroke-linejoin="round"/>

  <!-- clock face：更亮的环 -->
  <circle cx="256" cy="232" r="84" fill="none" stroke="#7dd3fc" stroke-width="14"/>
  <!-- 四分刻度：放进表盘内、提亮（原来暗到看不见） -->
  <g stroke="#94a3b8" stroke-width="7" stroke-linecap="round">
    <line x1="256" y1="172" x2="256" y2="160"/>
    <line x1="328" y1="232" x2="316" y2="232"/>
    <line x1="256" y1="292" x2="256" y2="304"/>
    <line x1="196" y1="232" x2="184" y2="232"/>
  </g>
  <!-- 指针 9:00（智能时段起点）+ 秒针琥珀色呼应徽章（倒数进行中的暗示）；指针收短与刻度脱开 -->
  <line x1="256" y1="232" x2="298" y2="274" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="232" x2="222" y2="232" stroke="#f8fafc" stroke-width="18" stroke-linecap="round"/>
  <line x1="256" y1="232" x2="256" y2="190" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="232" r="11" fill="#7dd3fc"/>

  <!-- reminder bell badge：铃铛重画（钟肩收窄、裙边外扩、钟摆独立） -->
  <circle cx="386" cy="338" r="46" fill="#fbbf24" stroke="#0b1220" stroke-width="10"/>
  <path d="M386 303 c-14 0 -25 11 -25 25 v13 c0 5 -4 10 -10 14 h70 c-6 -4 -10 -9 -10 -14 v-13 c0 -14 -11 -25 -25 -25 z" fill="#0b1220"/>
  <circle cx="386" cy="366" r="6" fill="#0b1220"/>
</svg>
