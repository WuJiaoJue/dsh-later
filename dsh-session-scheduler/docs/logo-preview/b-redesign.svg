<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243247"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgB)"/>

  <!-- bubble-clock：气泡轮廓即表盘——粗环 + 左下尾巴，一个符号说完「会话内定时」 -->
  <circle cx="256" cy="248" r="148" fill="none" stroke="#38bdf8" stroke-width="34"/>
  <!-- 尾巴：基点深入环带、圆角连接，与环无缝融合 -->
  <path d="M138 316 L98 430 L207 380 Z" fill="#38bdf8" stroke="#38bdf8" stroke-width="30" stroke-linejoin="round"/>

  <!-- 指针 9:00：时针指向尾巴方向（上下呼应），中心琥珀点唯一强调色 -->
  <line x1="256" y1="248" x2="178" y2="248" stroke="#f1f5f9" stroke-width="30" stroke-linecap="round"/>
  <line x1="256" y1="248" x2="256" y2="158" stroke="#f1f5f9" stroke-width="24" stroke-linecap="round"/>
  <circle cx="256" cy="248" r="20" fill="#fbbf24"/>
</svg>
