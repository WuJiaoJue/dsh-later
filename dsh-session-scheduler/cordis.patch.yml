# dsh-session-scheduler bundle patch：把 host 插件行插入 loader 树。
# 作为 dsh.bundle.patch 自动挂载（dsh plugin add 后即生效）；
# client 端通过 package.json 的 dsh.client 声明进入 boot 图。
#
# 配置说明（全部可选，默认开箱即用）：
#   - smart-window：智能时段配置（默认工作时间 09:00–18:00、午休 12:00–14:00、
#     晚间 18:00–22:00、夜间静默）。
#   - max-schedules：单 session 任务上限（默认 100）。
- insert:
  - id: session-scheduler
    name: dsh-session-scheduler
    # config:            # ← 需要时取消注释
    #   maxSchedules: 100
    #   smartWindow:
    #     workStart: "09:00"
    #     workEnd: "18:00"
    #     lunchStart: "12:00"
    #     lunchEnd: "14:00"
    #     eveningEnd: "22:00"
